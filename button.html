<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="button.css">

</head>
<body>
    <button  class="btn btn-danger">btn one</button>
    <button   class="btn btn-success">btn two</button>
    <button   class="btn btn-info">btn three</button>
    <button   class="btn btn-primary">btn four</button>
    <button   class="btn btn-warning">btn five</button>
    <br><br>

    <button   class="btn btn-outline-danger">btn one</button>
    <button   class="btn btn-outline-success">btn two</button>
    <button   class="btn btn-outline-info">btn three</button>
    <button   class="btn btn-outline-primary">btn four</button>
    <button  class="btn btn-outline-warning">btn five</button>

    <br><br>
    <button  class="btn btn-outline-primary btn-lg">large</button>
    <button   class="btn btn-outline-primary btn-sm">large</button>
    <br><br>
    <button   class="btn btn-outline-info btn-sm" disabled>large</button>
    <br><br>
    <a href="#" class="btn btn-outline-dark">google.com</a>
</body>
</html>
